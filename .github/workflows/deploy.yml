name: Deploy Wedding Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-wedding-page
  LOCATION: westeurope

jobs:
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    outputs:
      swa-name: ${{ steps.bicep.outputs.swaName }}
      swa-url: ${{ steps.bicep.outputs.swaUrl }}
      func-name: ${{ steps.bicep.outputs.funcName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        id: bicep
        run: |
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

          DEPLOY_OUTPUT=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --query 'properties.outputs' \
            --output json)

          SWA_NAME=$(echo "$DEPLOY_OUTPUT" | jq -r '.staticWebAppName.value')
          SWA_URL=$(echo "$DEPLOY_OUTPUT" | jq -r '.staticWebAppUrl.value')
          FUNC_NAME=$(echo "$DEPLOY_OUTPUT" | jq -r '.functionAppName.value')

          echo "swaName=$SWA_NAME" >> "$GITHUB_OUTPUT"
          echo "swaUrl=$SWA_URL" >> "$GITHUB_OUTPUT"
          echo "funcName=$FUNC_NAME" >> "$GITHUB_OUTPUT"

          echo "### Infrastructure Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SWA**: $SWA_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Function App**: $FUNC_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: $SWA_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-app:
    name: Build & Deploy App
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install & build API
        working-directory: api
        run: |
          npm ci
          npm run build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        working-directory: api
        run: |
          npm ci --omit=dev
          zip -r /tmp/func-deploy.zip . -x "src/*" "tsconfig.json" "local.settings.json" ".git*" ".funcignore"
          az functionapp deployment source config-zip \
            --resource-group "$RESOURCE_GROUP" \
            --name "${{ needs.deploy-infra.outputs.func-name }}" \
            --src /tmp/func-deploy.zip

      - name: Get SWA deployment token
        id: token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ needs.deploy-infra.outputs.swa-name }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.apiKey' --output tsv)
          echo "::add-mask::$TOKEN"
          echo "deploymentToken=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.deploymentToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/build
          skip_app_build: true

      - name: Summary
        run: |
          echo "### Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ needs.deploy-infra.outputs.swa-url }}" >> "$GITHUB_STEP_SUMMARY"
