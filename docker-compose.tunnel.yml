services:
  app:
    image: ghcr.io/markus-vesetrud/wedding-page:latest
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      - HOST_PORT=3000
      - PORT=3000
      - STATE_DIR=/data
    volumes:
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wedding-page-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
