services:
  app:
    image: ghcr.io/markus-vesetrud/wedding-page:latest
    pull_policy: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wedding-page-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
