services:
  app:
    image: ghcr.io/markus-vesetrud/wedding-page:latest
    container_name: wedding-page
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - STATE_FILE=/data/state.json
    volumes:
      - wedding-data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wedding-page-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  wedding-data:
